  mlflow:
    # Build the image from the mlflow_service directory
    build: ./mlflow_service
    container_name: MLflow
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: '1G'
    volumes:
      # This volume mapping is still necessary to save your data
      - ./mlruns:/mlruns

  prometheus:
    image: docker.arvancloud.ir/prom/prometheus:v2.47.2
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - client-0
      - client-1

  grafana:
    image: docker.arvancloud.ir/grafana/grafana:10.2.2
    container_name: grafana
    volumes:
      - ./monitoring/grafana_provisioning/:/etc/grafana/provisioning/
    ports:
      - "3000:3000"
    depends_on: [prometheus]

  ui:
    build: . # It can reuse the same environment as the server and clients
    container_name: FL_UI
    command: streamlit run app.py --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      # Mount the whole directory so it can find app.py, model.py, and the saved model
      - .:/app
    depends_on:
      - mlflow # The UI needs to talk to mlflow
      - server # The UI needs the model saved by the server
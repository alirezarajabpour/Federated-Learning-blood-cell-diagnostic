version: "3.9"

x-client-template: &client-template
  build: .
  depends_on:
    - server
  # environment:
  #   - OMP_NUM_THREADS=1
  #   - MKL_NUM_THREADS=1
  volumes:
    - ./data:/app/data
  deploy:
    resources:
      # limits:
      #   memory: '1G'
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  server:
    build: .
    container_name: server
    command: python -u server.py --strategy map
    ports:
      - "8080:8080"
    # volumes:
    #   - ./data:/app/data
    volumes:
      - .:/app
    depends_on:
      - mlflow
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  client-0:
    <<: *client-template
    container_name: client-0
    command: sh -c "sleep 20 && python -u client.py --client-id 0"
    ports:
      - "8001:8001"
  client-1:
    <<: *client-template
    container_name: client-1
    command: sh -c "sleep 20 && python -u client.py --client-id 1"
    ports:
      - "8002:8002"
  client-2:
    <<: *client-template
    container_name: client-2
    command: sh -c "sleep 20 && python -u client.py --client-id 2"
    ports:
      - "8003:8003"
  client-3:
    <<: *client-template
    container_name: client-3
    command: sh -c "sleep 20 && python -u client.py --client-id 3"
    ports:
      - "8004:8004"
